name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt
          rustup default 1.89.0

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/dbproxy

      - name: Render default and optional resources
        run: |
          helm template test charts/dbproxy --namespace database --kube-version 1.27.0 >/dev/null
          helm template test charts/dbproxy \
            --namespace database \
            --kube-version 1.27.0 \
            --set secret.create=true \
            --set secret.existingSecret= \
            --set-string secret.stringData.DBPROXY_FRONTEND_PASSWORD=test \
            --set-string secret.stringData.DBPROXY_BACKEND_PASSWORD=test \
            --set networkPolicy.enabled=true \
            --set serviceMonitor.enabled=true \
            >/dev/null

  integration:
    name: Live protocol integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0

      - name: Run MySQL, TimescaleDB, and Redis integration
        env:
          DBPROXY_COMPOSE: docker compose
        run: ./scripts/integration.sh
