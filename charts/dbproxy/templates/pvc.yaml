{{- if and .Values.persistence.enabled (ne (int .Values.replicaCount) 1) -}}
{{- fail "persistence.enabled requires replicaCount=1; use one release/PVC per active XA replica or a StatefulSet" -}}
{{- end -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dbproxy.fullname" . }}-xa
  labels:
    {{- include "dbproxy.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
