{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dbproxy.fullname" . }}
  labels:
    {{- include "dbproxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dbproxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingress.podSelector | nindent 12 }}
      ports:
        {{- range $name, $port := .Values.service.ports }}
        {{- if $port.enabled }}
        - protocol: TCP
          port: {{ $port.port }}
        {{- end }}
        {{- end }}
    {{- if .Values.adminService.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.adminIngress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.adminIngress.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.adminService.port }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    - {}
    {{- end }}
{{- end }}
