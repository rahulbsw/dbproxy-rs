apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbproxy.fullname" . }}
  labels:
    {{- include "dbproxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.externalTrafficPolicy (ne .Values.service.type "ClusterIP") }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "dbproxy.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $name, $port := .Values.service.ports }}
    {{- if $port.enabled }}
    - name: {{ include "dbproxy.portName" (dict "name" $name) }}
      port: {{ $port.port }}
      targetPort: {{ include "dbproxy.portName" (dict "name" $name) }}
      protocol: TCP
    {{- end }}
    {{- end }}
