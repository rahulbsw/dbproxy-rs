[proxy]
listen = "0.0.0.0:6033"
server_version = "8.0.36-dbproxy-rs"
auth_plugin = "caching_sha2_password"
max_connections = 1024
client_io_timeout_seconds = 300
backend_connect_timeout_seconds = 5
backend_query_timeout_seconds = 30
shutdown_grace_seconds = 10
max_query_bytes = 1048576
max_result_rows = 100000
max_result_bytes = 67108864
result_mode = "buffered"
max_prepared_statements_per_connection = 1024

[proxy.tls]
# "disabled", "preferred" (TLS or plaintext), or "required".
mode = "disabled"
# cert_path = "/etc/dbproxy/tls/server-chain.pem"
# key_path = "/etc/dbproxy/tls/server-key.pem"

[admin]
# Keep this on loopback unless an external firewall protects it.
listen = "127.0.0.1:6071"
max_connections = 32
request_timeout_seconds = 5

[postgres]
# PostgreSQL/TimescaleDB forwarding is disabled in the starter topology.
# When enabled, clients authenticate directly with the selected PostgreSQL
# backend and TLS remains end to end.
enabled = false
read_write_listen = "0.0.0.0:6432"
read_only_listen = "0.0.0.0:6433"
max_connections = 1024
connect_timeout_seconds = 5
shutdown_grace_seconds = 10
fallback_to_primary = true
# Per-direction transparent relay buffer. Each connection owns two buffers.
relay_buffer_bytes = 32768
# In sharded mode this startup parameter (or the equivalent libpq
# `options=-c dbproxy.shard_key=<value>`) selects and pins one shard.
shard_key_parameter = "dbproxy.shard_key"

[postgres.sharding]
enabled = false
# "hash", "range", or "value". See README for complete mappings.
strategy = "hash"

# [[postgres_backends]]
# name = "timescale-primary"
# address = "timescale-primary.internal:5432"
# role = "primary"
# weight = 1
# shard = "default"

# [[postgres_backends]]
# name = "timescale-replica"
# address = "timescale-replica.internal:5432"
# role = "replica"
# weight = 1
# shard = "default"

[redis]
# Transparent RESP2/RESP3 forwarding is disabled in the starter topology.
# AUTH/ACL and TLS remain end to end with the selected Redis backend.
enabled = false
# "connection" preserves transparent connection pinning. "command" enables
# proxy-side key routing and explicitly supported multi-key fanout.
routing_mode = "connection"
# "stable_fnv" preserves the original DBProxy map. "redis_crc16" enables
# Redis-compatible {...} hash tags for hash sharding.
hash_algorithm = "stable_fnv"
read_write_listen = "0.0.0.0:6380"
read_only_listen = "0.0.0.0:6381"
max_connections = 1024
connect_timeout_seconds = 5
shutdown_grace_seconds = 10
fallback_to_primary = true
cross_shard_reads = true
# Cross-shard DEL/UNLINK/MSET are non-atomic and disabled by default.
cross_shard_writes = false
max_fanout_shards = 32
max_shard_connections_per_client = 64
max_command_bytes = 67108864
max_response_bytes = 67108864
client_idle_timeout_seconds = 300
backend_response_timeout_seconds = 30
relay_buffer_bytes = 32768
# In sharded mode this command must be sent before AUTH/HELLO:
#   DBPROXY.SHARD <value>
shard_command = "DBPROXY.SHARD"

[redis.sharding]
enabled = false
# The Redis adapter also supports Valkey because both use RESP.
strategy = "hash"

# [[redis_backends]]
# name = "redis-primary"
# address = "redis-primary.internal:6379"
# role = "primary"
# weight = 1
# shard = "default"

# [[redis_backends]]
# name = "redis-replica"
# address = "redis-replica.internal:6379"
# role = "replica"
# weight = 1
# shard = "default"

[[users]]
username = "app"
password = "${DBPROXY_FRONTEND_PASSWORD}"

[[backends]]
name = "mysql-primary-1"
address = "127.0.0.1:3306"
role = "primary"
# Backends without an explicit shard belong to "default".
shard = "default"
weight = 1
username = "proxy"
password = "${DBPROXY_BACKEND_PASSWORD}"
database = "app"

[backends.tls]
# "disabled", "required" (encrypted without certificate verification),
# "verify_ca", or "verify_identity" (CA and hostname verification).
mode = "disabled"
# ca_path = "/etc/dbproxy/tls/mysql-ca.pem"
# server_name = "mysql-primary-1.internal"
# use_system_roots = false
# client_cert_path = "/etc/dbproxy/tls/dbproxy-client-chain.pem"
# client_key_path = "/etc/dbproxy/tls/dbproxy-client-key.pem"

[backends.pool]
min = 2
max = 64
connection_ttl_seconds = 300
inactive_ttl_seconds = 60

[[backends]]
name = "mysql-replica-1"
address = "127.0.0.1:3307"
role = "replica"
shard = "default"
weight = 2
username = "proxy"
password = "${DBPROXY_BACKEND_PASSWORD}"
database = "app"

[backends.pool]
min = 2
max = 64
connection_ttl_seconds = 300
inactive_ttl_seconds = 60

[[backends]]
name = "mysql-replica-2"
address = "127.0.0.1:3308"
role = "replica"
shard = "default"
weight = 1
username = "proxy"
password = "${DBPROXY_BACKEND_PASSWORD}"
database = "app"

[backends.pool]
min = 2
max = 64
connection_ttl_seconds = 300
inactive_ttl_seconds = 60

[routing]
read_write_split = true
fallback_to_primary = true
read_after_write_seconds = 2
reject_multi_statements = true
deny = [
  "LOAD DATA LOCAL INFILE",
  "INTO OUTFILE",
]

# See dbproxy.sharded.example.toml for a complete multi-shard and multi-write
# topology. Both features are disabled in this single-shard starter config.
[sharding]
enabled = false
default_shard = "default"
missing_key_policy = "reject"

[write_fanout]
enabled = false
target_shards = []
tables = []
failure_policy = "all"
max_concurrency = 8

[health_check]
interval_seconds = 5
timeout_seconds = 2
unhealthy_after_failures = 3

[logging]
filter = "dbproxy=info"
json = false
